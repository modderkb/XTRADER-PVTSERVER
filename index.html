<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>X TRADER AI LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#050816;
  --primary:#7c3aed;
  --secondary:#00e5ff;
  --pink:#ff3cac;
  --green:#6cff32;
  --soft:#9aa4b2;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Inter,sans-serif;

  background:
  radial-gradient(circle at top left,#27104a 0%,transparent 35%),
  radial-gradient(circle at bottom right,#001f3f 0%,transparent 40%),
  var(--bg);

  color:white;
}

.phone{

  width:min(390px,95vw);
  height:820px;

  background:rgba(12,16,28,.95);

  border-radius:34px;

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  box-shadow:
  0 0 50px rgba(124,58,237,.35),
  inset 0 0 40px rgba(255,255,255,.03);

  overflow:hidden;
  position:relative;
}

.punch{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:28px;
  border-radius:20px;
  background:#0a0f1f;
}

.camera{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  height:12px;
  border-radius:50%;
  background:linear-gradient(135deg,#00e5ff,#7c3aed);
  box-shadow:0 0 10px #00e5ff;
}

.screen{
  position:absolute;
  inset:55px 14px 14px;
  border-radius:26px;
  overflow:auto;
  background:linear-gradient(180deg,#111827,#0a0f1c);
  padding:26px 22px;
}

.logo-box{
  width:85px;
  height:85px;
  border-radius:24px;
  margin:auto;
  background:linear-gradient(135deg,var(--primary),var(--secondary),var(--pink));
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 35px rgba(124,58,237,.5);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-8px);}
}

.logo-box span{
  font-family:Orbitron;
  font-size:30px;
  font-weight:800;
}

.title{
  margin-top:22px;
  text-align:center;
  font-family:Orbitron;
  font-size:24px;
  font-weight:800;
  background:linear-gradient(90deg,var(--secondary),var(--pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  margin-top:8px;
  color:var(--soft);
  font-size:13px;
}

.card{
  margin-top:30px;
  padding:22px;
  border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.05);
}

label{
  display:block;
  margin-bottom:8px;
  font-size:13px;
  color:#c9d1e8;
}

.input{
  height:56px;
  border-radius:16px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#0c1325;
  border:1px solid rgba(255,255,255,.05);
  transition:.25s;
}

.input:focus-within{
  border-color:var(--secondary);
  box-shadow:0 0 15px rgba(0,229,255,.25);
}

.input input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:15px;
}

.input input::placeholder{
  color:#7682a2;
}

.btn{
  width:100%;
  height:54px;
  border:none;
  border-radius:18px;
  cursor:pointer;
  font-weight:800;
  font-size:14px;
  margin-top:16px;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px) scale(1.02);
}

.primary{
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--pink));
  box-shadow:0 0 24px rgba(255,60,172,.35);
}

.success-card{
  display:none;
  margin-top:24px;
  padding:22px;
  border-radius:22px;
  text-align:center;
  background:linear-gradient(135deg,rgba(108,255,50,.12),rgba(0,229,255,.08));
  border:1px solid rgba(108,255,50,.25);
}

.success-card h2{
  font-size:20px;
  margin-bottom:10px;
  color:var(--green);
}

.success-card p{
  color:#c8ffd7;
  font-size:14px;
  line-height:1.6;
}

.toast{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:22px;
  min-width:250px;
  padding:14px 18px;
  border-radius:16px;
  background:#101827;
  border:1px solid rgba(255,255,255,.08);
  color:white;
  text-align:center;
  display:none;
}

.toast.error{
  border-color:#ff3c7c;
  color:#ffd6e4;
}

</style>

</head>

<body>

<div class="phone">

  <div class="punch"></div>
  <div class="camera"></div>

  <div class="screen">

    <div class="logo-box">
      <span>X</span>
    </div>

    <div class="title">X TRADER AI</div>
    <div class="subtitle">SECURE LOGIN SYSTEM</div>

    <div class="card">

      <label>ENTER LICENSE KEY</label>

      <div class="input">
        <input id="loginKey" type="text" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
      </div>

      <button class="btn primary" id="loginBtn">
        LOGIN NOW
      </button>

      <!-- NEW BUTTON -->
      <button
        class="btn"
        style="background:linear-gradient(135deg,#00e5ff,#7c3aed);color:white;box-shadow:0 0 24px rgba(0,229,255,.25);"
        onclick="window.location.href='https://t.me/desibillal1'"
      >
        BUY LICENSE KEY
      </button>

      <div class="success-card" id="successCard">

        <h2>KEY NOT ACTIVATED</h2>

        <p id="successText">
          This key is not activated yet.
          <br><br>
          Click below to activate 👇
        </p>

        <button class="btn primary" id="activateBtn">
          ACTIVATE
        </button>

      </div>

    </div>

  </div>

  <div class="toast" id="toast"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, child, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMY5a4iTzcP-dUOGR4J4Q1_PVS-BXYYLw",
  authDomain: "lord-x-2f6d8.firebaseapp.com",
  databaseURL: "https://lord-x-2f6d8-default-rtdb.firebaseio.com",
  projectId: "lord-x-2f6d8",
  storageBucket: "lord-x-2f6d8.appspot.com",
  messagingSenderId: "621018871322",
  appId: "1:621018871322:android:87d689999e7ae2337943a3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const toast = document.getElementById("toast");
const successCard = document.getElementById("successCard");
const loginBtn = document.getElementById("loginBtn");

function showToast(msg, error=false){
  toast.innerText = msg;
  toast.classList.toggle("error", error);
  toast.style.display = "block";
  setTimeout(()=>{ toast.style.display = "none"; },2500);
}

async function login(){

  const key = document.getElementById("loginKey").value.trim();

  if(!key){
    showToast("Please Enter Key", true);
    return;
  }

  loginBtn.innerText = "VERIFYING...";
  loginBtn.disabled = true;

  try{

    const snapshot = await get(child(ref(db), "keys/" + key));

    if(snapshot.exists()){

      const data = snapshot.val();

      if(data.activated === true){
        showToast("Login Success");
        setTimeout(()=>{ window.location.href = "home.html"; },1500);
      } else {
        successCard.style.display = "block";
        showToast("Key Not Activated", true);
      }

    } else {
      successCard.style.display = "none";
      showToast("Invalid License Key", true);
    }

  }catch(err){
    console.log(err);
    showToast("Firebase Connection Error", true);
  }

  loginBtn.disabled = false;
  loginBtn.innerText = "LOGIN NOW";
}

loginBtn.addEventListener("click", login);

document.getElementById("loginKey").addEventListener("keypress", e=>{
  if(e.key==="Enter") login();
});

document.getElementById("activateBtn").addEventListener("click", ()=>{
  window.location.href = "activate.html";
});

</script>

</body>
</html>
